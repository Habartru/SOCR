name: Python CI

on:
  push:
    branches: [ chore-python-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: pytest / ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python: [ "3.10", "3.11", "3.12" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --install-types --non-interactive .
      - name: Install project (best-effort)
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { echo "no requirements.txt" }
        shell: pwsh
      - name: Tests
        run: |
          if (Test-Path tests) { pytest -q } else { echo "no tests" }
        shell: pwsh